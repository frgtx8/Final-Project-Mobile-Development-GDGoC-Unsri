name: efooty_tactics
description: "Smart Squad Builder, AI Meta Coach & Player Guide for eFootball"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  supabase_flutter: ^2.8.0
  google_generative_ai: ^0.4.6
  flutter_dotenv: ^5.2.1
  uuid: ^4.5.1
  intl: ^0.20.2
  http: ^1.2.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/data/
